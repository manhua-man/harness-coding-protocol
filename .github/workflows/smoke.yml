name: smoke-suite

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run smoke-suite (Parts 1–3)
        run: npx --yes tsx scripts/smoke-suite.mjs
